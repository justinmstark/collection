apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisky-app
  labels:
    app: whisky-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisky-app
  template:
    metadata:
      labels:
        app: whisky-app
    spec:
      containers:
        - name: app
          image: 192.168.3.100:30500/whisky-app:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: whisky-app-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)"
            - name: NEXTAUTH_URL
              value: "http://whisky-app.local"
            - name: MINIO_ENDPOINT
              value: "minio"
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_PUBLIC_URL
              value: "http://whisky-app.local:9000"
            - name: NEXT_PUBLIC_MINIO_PUBLIC_URL
              value: "http://whisky-app.local:9000"
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command:
            - sh
            - -c
            - until pg_isready -h db -p 5432; do echo waiting for db; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: whisky-app
spec:
  selector:
    app: whisky-app
  ports:
    - port: 4000
      targetPort: 3000
