# The collection web app. Config comes from the `collection-app` secret
# (k8s/create-secrets.sh). Public access is via Cloudflare Tunnel (cloudflared.yaml).
apiVersion: v1
kind: Service
metadata:
  name: collection-app
  namespace: collection
spec:
  selector:
    app: collection-app
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collection-app
  namespace: collection
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: collection-app
  template:
    metadata:
      labels:
        app: collection-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        # Keep the schema in sync with prisma/schema.prisma before the app starts.
        - name: migrate
          image: ghcr.io/justinmstark/collection:latest
          imagePullPolicy: Always
          command: [node, node_modules/prisma/build/index.js, db, push, --skip-generate]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: collection-app
                  key: DATABASE_URL
      containers:
        - name: app
          image: ghcr.io/justinmstark/collection:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: collection-app
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
# LAN access without the tunnel: http://<any node IP>:30400 (e.g. http://192.168.3.100:30400)
apiVersion: v1
kind: Service
metadata:
  name: collection-app-lan
  namespace: collection
spec:
  type: NodePort
  selector:
    app: collection-app
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30400
