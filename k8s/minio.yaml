# MinIO object storage for bottle images. Internal only: no ingress. Browsers get
# images through the app's /minio proxy (see app/next.config.ts).
# Credentials come from the `collection-minio` secret (k8s/create-secrets.sh).
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: collection
spec:
  selector:
    app: collection-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: collection
spec:
  replicas: 1
  serviceName: minio
  selector:
    matchLabels:
      app: collection-minio
  template:
    metadata:
      labels:
        app: collection-minio
    spec:
      containers:
        - name: minio
          # Official minio/minio images were withdrawn; this is a maintained community build.
          image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          args: [server, /data, --console-address, ":9001"]
          envFrom:
            - secretRef:
                name: collection-minio
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
---
# Idempotent bucket setup: creates the bucket and allows anonymous read, which the
# app's /minio proxy relies on. Safe to re-run (delete the Job and re-apply).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: collection
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: docker.io/pgsty/mc:RELEASE.2026-11-09T00-00-00Z
          envFrom:
            - secretRef:
                name: collection-minio
          env:
            - name: HOME
              value: /tmp
          command:
            - sh
            - -c
            - |
              set -e
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/collection-images
              mc anonymous set download local/collection-images
