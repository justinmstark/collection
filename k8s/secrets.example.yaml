# DO NOT commit secrets.yaml — copy this file, fill in values, apply manually.
# Create the secret: kubectl apply -f k8s/secrets.yaml
#
# Alternatively, generate from your .env:
#   kubectl create secret generic collection-secrets \
#     --from-env-file=.env -n collection --dry-run=client -o yaml > k8s/secrets.yaml
#   kubectl apply -f k8s/secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: collection-secrets
  namespace: collection
type: Opaque
stringData:
  DATABASE_URL: "postgresql://collection:CHANGE_ME@postgres:5432/collection"
  POSTGRES_USER: "collection"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "collection"
  NEXTAUTH_SECRET: "CHANGE_ME"
  NEXTAUTH_URL: "https://collection.justinstark.info"
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_ACCESS_KEY: "CHANGE_ME"
  MINIO_SECRET_KEY: "CHANGE_ME"
  MINIO_BUCKET: "collection-images"
  OPENAI_API_KEY: ""
  GOOGLE_SEARCH_API_KEY: ""
  GOOGLE_SEARCH_CX: ""
