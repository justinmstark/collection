# PostgreSQL for the collection app. Credentials come from the `collection-db`
# secret (created by k8s/create-secrets.sh, never committed).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: collection
spec:
  selector:
    app: collection-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: collection
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app: collection-postgres
  template:
    metadata:
      labels:
        app: collection-postgres
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine
          envFrom:
            - secretRef:
                name: collection-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: UTC
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
